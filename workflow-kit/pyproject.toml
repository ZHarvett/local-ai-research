[project]
name = "workflow-kit"
version = "0.1.0"
description = "Planning-chat plan execution kit for Claude Code sessions (state, lanes, gates, reviews, escalations)"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.watchfiles]
# Not a built package: the uv project exists only to run tests and lint.
include = []

[tool.uv]
# Use the interpreter already installed on the system; never download Python.
python-downloads = "never"
python-preference = "only-system"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # test tables and fixtures are written compactly

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
