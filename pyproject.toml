[project]
name = "smallpc"
version = "0.1.0.dev0"
description = "Local AI on a Small PC: measured llama.cpp baseline tooling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "gguf>=0.10",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smallpc"]

[tool.uv]
# Use the interpreter already installed on the system; never download Python.
python-downloads = "never"
python-preference = "only-system"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # test tables and fixtures are written compactly

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: test needs the GPU / a real llama-server (excluded in CI with -m 'not gpu')",
]
