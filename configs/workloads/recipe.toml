# WP8 workload recipe: the hand-edited inputs of `python -m smallpc.workloads build`.
# The generated result is configs/workloads/manifest.json (recipes only, never repository text).
# Instruction wording is our own text (not repository text) and lives here; the manifest refers to
# it by wording id and SHA-256.

schema = 1
seed = "smallpc-wp8-v1"      # fixed seed for nonces, sampling seeds and the pool shuffle
K = 1024                     # 1K = 1024 tokens (docs/decisions.md, WP8)
variants = 5                 # repetition r uses variant r mod 5
append_tokens = 3000         # tokens appended in Request B, wrapper and generation prompt included
n_predict_b = 400            # generated tokens of Request B (and the short-point maximum)
short_gen_tokens = 100       # the short_gen threshold the short points must reach

# lengths and depths in units of K
lengths_k = [2, 8, 16, 24, 32, 48, 64, 96]
depths_k = [8, 16, 24, 32, 48, 64, 96]
short_k = 2
warmup_k = 8
sanity_k = 2
equiv_k = [2, 8, 32]

# context size -> depths (§5.3), in K
[contexts]
32768 = [8, 16, 24]
65536 = [16, 32, 48]
131072 = [32, 64, 96]

[tokenize]
# add_special follows the GGUF `tokenizer.ggml.add_bos_token`; special tokens are always parsed
# (the chat template needs them). Token-array requests carry no automatic BOS.
parse_special = true

[exclusions]
# "from_vocab": the special-token strings are read from the model vocabulary (GGUF control and
# user-defined tokens, cross-checked with /tokenize) and any file or command-output line containing
# one is excluded, so no repository text can turn into a control token.
special_tokens = "from_vocab"
max_file_bytes = 200000
min_file_bytes = 200
max_line_chars = 1000
dir_names = ["vendor", "vendored", "_vendor", "third_party", "node_modules", "fixtures", "testdata",
             "generated", "build", "dist", "target", ".github", "docs", "assets"]
name_substrings = [".min.", "_pb2", ".lock"]
generated_markers = ["@generated", "DO NOT EDIT", "Code generated", "auto-generated", "autogenerated"]

[[sources]]
name = "poetry"
url = "https://github.com/python-poetry/poetry"
commit = "94b6e35b9091991887aa54feeb3771a86d3bd692"   # tag 2.5.1
spdx = "MIT"
language = "python"
extension = ".py"
clone_dir = "third_party/workload-sources/poetry"
license_files = ["LICENSE"]
defs_pattern = "^\\s*(async def|def|class) \\w+"
imports_pattern = "^(from|import) "

[[sources]]
name = "axum"
url = "https://github.com/tokio-rs/axum"
commit = "c59208c86fded335cd85e388030ad59347b0e5ae"   # tag axum-v0.8.9
spdx = "MIT"
language = "rust"
extension = ".rs"
clone_dir = "third_party/workload-sources/axum"
# No LICENSE at the repository root at this tag: one per crate (all MIT text, different copyright
# line and line wrapping). The first entry is the primary one.
license_files = ["axum/LICENSE", "axum-core/LICENSE", "axum-extra/LICENSE", "axum-macros/LICENSE"]
defs_pattern = "^\\s*(pub(\\([a-z]+\\))? )?(async )?(fn|struct|enum|trait) \\w+"
imports_pattern = "^\\s*(pub )?use "

[prompt]
system = "You are an expert software engineer who writes complete, correct, well-structured code."
# The assistant turn that precedes the tool output in Request B.
assistant_stub = "I'll check the repository history and layout first."

# wording ids; the chosen wording per variant (index 0..4) is in [chosen]. A rejected wording is
# switched here (docs/decisions.md records why).
[chosen]
wording = ["W0", "W0", "W0", "W0", "W0"]

[wordings.W0]
a = "Using the code above as reference for style, {task} Write the complete implementation as runnable code with docstrings or doc comments, then add unit tests. Do not abbreviate, skip parts or use placeholders."
b = "Based on the repository output above, {task} Write the complete code with docstrings or doc comments, then add unit tests. Do not abbreviate, skip parts or use placeholders."

[wordings.W1]
a = "Using the code above as reference for style, {task} First list your design decisions briefly, then give the complete code with every function fully implemented, then thorough unit tests and a short usage example. The answer must be long and detailed."
b = "Based on the repository output above, {task} First list your design decisions briefly, then give the complete code with every function fully implemented, then thorough unit tests and a short usage example. The answer must be long and detailed."

[wordings.W2]
a = "You are reviewing the code above before extending it. {task} Deliver a full implementation, tests for every public function, and a README section explaining it. Write all of it out in full."
b = "You have just read the repository output above. {task} Deliver a full implementation, tests for every public function, and a README section explaining it. Write all of it out in full."

# task text per variant (index 0..4); `reserve` for the warm-up, equivalence and sanity prompts.
[tasks]
a = [
  "design and implement a small in-memory cache with time-to-live expiry and size limits, in Python.",
  "write a command-line tool in Rust that scans a directory tree and reports duplicate files by content hash.",
  "implement a token-bucket rate limiter with a synchronous and an asynchronous interface, in Python.",
  "implement a minimal configuration-file loader with validation and helpful error messages, in Rust.",
  "implement an event bus with typed handlers, priorities and error isolation, in Python.",
]
b = [
  "write a new module that summarises recent changes by file and author-independent statistics, in Python.",
  "write a small Rust crate that parses `git diff --stat` style output into structured records.",
  "write a Python script that finds definitions and groups them by module, then prints a report.",
  "write a Rust program that walks a file listing and reports the largest files by size.",
  "write a Python tool that lists every import and reports which modules depend on which.",
]
reserve_a = [
  "implement a least-recently-used cache with a clean public interface, in Python.",
  "implement a simple argument parser with subcommands and help output, in Rust.",
  "write a retry helper with exponential backoff and jitter, in Python.",
]
reserve_b = "write a small utility that reports the most frequently changed files, in Python."

# Tool-output-like text appended in Request B: git only, no installs, deterministic at the pinned
# commits. Each variant runs its commands in both repositories (placeholders: {glob}, {defs}, {imports}).
# Date format is ISO with the commit's own offset; authors and e-mail addresses are never printed.
[[appends]]
variant = 0
commands = [["git", "log", "--stat", "-n", "100", "--date=iso-strict", "--format=%h %ad %s"]]

[[appends]]
variant = 1
commands = [["git", "diff", "--stat", "HEAD~60", "HEAD"], ["git", "diff", "-U1", "HEAD~12", "HEAD", "--", "{glob}"]]

[[appends]]
variant = 2
commands = [["git", "grep", "-n", "-I", "-E", "{defs}", "--", "{glob}"]]

[[appends]]
variant = 3
commands = [["git", "ls-tree", "-r", "-l", "HEAD"]]

[[appends]]
variant = 4
commands = [["git", "grep", "-n", "-I", "-E", "{imports}", "--", "{glob}"]]
