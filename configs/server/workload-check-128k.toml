# WP8 workload server: build, verify and live checks (smallpc.workloads). A candidate profile like
# health-64k, at 128K context: --fit on, 8-bit KV, -fa on, -np 1, --metrics, and -lv 4 (WP6
# decision: every sweep cell runs with -lv 4). Chat template: the one embedded in the GGUF, thinking
# at the template default. No slot-save path: the workload checks do not use /slots.
profile = "candidate"
context = 131072
fit = "on"
cache_type_k = "q8_0"
cache_type_v = "q8_0"
flash_attn = "on"
parallel = 1
metrics = true
log_verbosity = 4
