# Tuned configuration for 32K context (step plan v1.7, Stage 2 outcome in section 5.4).
# Provenance: the Stage 2 winner for 32K is s2a-P6-32K-b4096-mtp0, measured in session s2a-32K (5 repetitions,
# --cache-ram 2048 and the other Stage 2 values as listed below); final selection (data/analysis/stage2/32K-final.md): MTP off, 8-bit KV as measured (the sweep default; FP16 against 8-bit was not measured on this configuration).
# Output sanity check (section 5.6): pass, data/sanity/stage2-all.json (cell s2a-P6-32K-b4096-mtp0).
# The expert cache (11520 MiB) is the probed max-fit value of that cell, fixed here as a number.
# The rendered argument list equals the winning cell's resolved config apart from --metrics and -lv 4,
# which the sweep specs add at run time (tests/test_stage3_configs.py checks this).
profile = "tuned"
context = 32768
cpu_moe = true
moe_cache_mib = 11520
batch = 4096
ubatch = 4096
cache_type_k = "q8_0"
cache_type_v = "q8_0"
flash_attn = "on"
parallel = 1
cache_ram = 2048
