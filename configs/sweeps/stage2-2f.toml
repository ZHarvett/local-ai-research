# Stage 2 2f host prompt cache (--cache-ram) (plan v1.6, WP12), generated by `python -m smallpc.stage2 spec --stage 2f --out configs/sweeps/stage2-2f.toml`.
# Generated file: change the inputs and regenerate; never edit by hand.
# Shortlist: data/analysis/select-screening.json sha256 44c8375c9fa8934b79f4822f95b22847da4f805b9e879e7c953a85250db42988
# Stage 1 spec (axes, canary): configs/sweeps/stage1.toml sha256 0b0cd1789469c61682201ac5eade0dfe05d12f80530eea24b5fe4de4a0c90185
# cache_ram: varied by the cells of this stage (2f)
# Rules applied by `python -m smallpc.stage2 decide` (plan text, verbatim):
#   "Top" means first in the Stage 1 order, even where the pair is too close to call at n = 2.
#   - **2f Host prompt cache (`--cache-ram`). Runs first.** Reason: in Stage 1, 14 of 38 windows at 128K and one at 64K were paging-flagged, all in the second repetition of a long-running server, in cells with a large memory-mapped model. The 15 re-runs on fresh servers were all clean, and the server's anonymous memory grew in step with its host prompt cache (default 8,192 MiB), which every unique benchmark prompt fills. That points to host-memory pressure on a 32 GB machine, and the benchmark's requests never hit that cache, so it only costs memory here. Cells, with MTP off: the top placement at 128K with `--cache-ram` 8192 (the default), 4096, 2048 and 0; and at 64K with 8192 and 2048. Rule: the chosen value is the largest tested value with no paging-flagged window in any of its 5 repetitions, unless its mean T_turn_400 is more than 3% above the mean of the 8192 cell's clean units. If the 8192 cell is already clean, the default stays. If no tested value is clean, stop and report: the cause is then not the host cache. The chosen value is used in every later candidate cell and in the tuned configs. Stock keeps the default. The trade-off is documented: a small host cache means that switching between conversations re-reads the prompt instead of restoring it (this matters for Step 5).
name = "stage2-2f"
repetitions = 5
shuffle_seed = 20261109
max_restarts = 2
expect_cells = 6

# Candidate cells get [defaults]; the section 5.4 sweep defaults (-ctk/-ctv q8_0, -fa on,
# -np 1) are applied by ServerConfig.effective() when the argv is rendered; --port comes
# from machine.toml.
[defaults]
metrics = true
log_verbosity = 4
[stock_defaults]
metrics = true
log_verbosity = 4

[axes.context]
64K  = { context = 65536 }
128K = { context = 131072 }
[axes.batch]
b4096 = { batch = 4096, ubatch = 4096 }
[axes.placement]
P2 = { fit = "on", fit_target = 256 }
P6 = { cpu_moe = true, moe_cache_mib = "@max_fit" }
[axes.mtp]
mtp0 = {}
[axes.cram]
cram8192 = { cache_ram = 8192 }
cram4096 = { cache_ram = 4096 }
cram2048 = { cache_ram = 2048 }
cram0    = { cache_ram = 0 }

[[cells]]
name = "s2f-{placement}-{context}-{batch}-{mtp}-{cram}"
profile = "candidate"
product = { placement = ["P2"], context = ["128K"], batch = ["b4096"], mtp = ["mtp0"], cram = ["cram8192", "cram4096", "cram2048", "cram0"] }

[[cells]]
name = "s2f-{placement}-{context}-{batch}-{mtp}-{cram}"
profile = "candidate"
product = { placement = ["P6"], context = ["64K"], batch = ["b4096"], mtp = ["mtp0"], cram = ["cram8192", "cram2048"] }

[canary]
cell = { profile = "candidate", context = 65536, fit = "on", metrics = true, log_verbosity = 4 }
repetitions = 3
points = ["short", "16K"]
