# whitespace normalisation (details: data/health/model-check.json, chat_template.diff).
embedded_note = "embedded template is a modified variant (comment: 'Unsloth fixes - developer role, tool calling'): accepts the developer role, merges the first two system messages, renders tool-call arguments differently, no error on unexpected roles; 7828 vs 7536 bytes. llama-server uses the embedded one unless --chat-template-file is given. Decision open, see docs/decisions.md."

# Recommended sampling, recorded exactly as the model card states it (base repo README.md at the
# pinned revision; the GGUF card is the same text). The card does NOT give separate settings for
# thinking vs non-thinking mode or for coding. Its benchmark footnotes quote per-benchmark values
# (temperature 1.0 with top_p 1.0 or 0.95, ClawEval temperature 0.6); those describe evaluation
# harnesses, not recommendations, and are not recorded here.
[sampling.general]
temperature = 0.6
top_p       = 0.95
top_k       = 20
wording     = "For general tasks: temperature=0.6, top_p=0.95, top_k=20"
source      = "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B/blob/10fbf86fed7ecee4a061f8b499a618f46001cac1/README.md (Quickstart, \"Recommended sampling parameters\")"

[sampling.benchmark]
temperature = 1.0
wording     = "To reproduce the reported benchmarks: temperature=1.0"
source      = "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B/blob/10fbf86fed7ecee4a061f8b499a618f46001cac1/README.md (Quickstart, \"Recommended sampling parameters\")"

# Not from the card: the base repo's generation_config.json (defaults for transformers).
